<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日文積木">
<meta name="theme-color" content="#1a0a1e">
<title>日文句型積木</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#1a0a1e;--card:#241432;--border:#3a2450;
  --gold:#f5c842;--accent:#e05070;--teal:#26a69a;
  --blue:#5ca0e8;--green:#4caf50;--red:#ef5350;
  --purple:#9c6ade;--orange:#f5a623;--pink:#ec407a;
  --text:#ece4f0;--dim:#8a7a9a;--muted:#5a4a6a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Zen Maru Gothic','Fredoka',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;user-select:text;-webkit-user-select:text;}

.top-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:100;border-bottom:1px solid var(--border);}
.user-btn{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;font-size:0.7rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.user-btn.active{background:var(--gold);color:#1a1a2e;border-color:var(--gold);font-weight:700;}
.score-badge{margin-left:auto;padding:5px 14px;border-radius:14px;background:var(--green);color:white;font-size:0.72rem;font-weight:700;}

.rule-tabs{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rule-tabs::-webkit-scrollbar{display:none;}
.rule-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;font-size:0.68rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.rule-tab.active{background:var(--gold);color:#1a1a2e;border-color:var(--gold);transform:scale(1.05);}
.rule-tab.coming{opacity:0.4;cursor:default;}

.content{padding:10px 12px 80px;}
.rule-card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.rule-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rule-emoji{font-size:1.6rem;}
.rule-name{font-size:0.95rem;font-weight:700;}
.rule-formula-tag{font-size:0.68rem;color:var(--gold);background:rgba(245,200,66,0.1);padding:3px 10px;border-radius:8px;display:inline-block;margin-top:3px;}

.comic-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0;}
.comic-panel{border-radius:10px;padding:10px 8px;text-align:center;position:relative;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.panel-num{position:absolute;top:4px;left:7px;font-size:0.5rem;font-weight:700;opacity:0.4;}
.panel-emoji{font-size:1.4rem;margin-bottom:3px;}
.panel-text{font-size:0.68rem;font-weight:600;line-height:1.3;color:rgba(0,0,0,0.7);}
.comic-formula-text{text-align:center;font-size:0.68rem;font-weight:700;color:var(--dim);padding:4px 0;}

.blindspot-box{background:rgba(255,255,255,0.02);border-radius:10px;padding:10px;margin-top:8px;}
.bs-label{font-size:0.62rem;color:var(--gold);font-weight:600;margin-bottom:4px;}
.bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.bs-cn,.bs-jp{font-size:0.65rem;line-height:1.4;padding:6px;border-radius:8px;}
.bs-cn{background:rgba(224,80,112,0.08);}
.bs-jp{background:rgba(92,160,232,0.08);}
.bs-cn b,.bs-jp b{font-size:0.58rem;display:block;margin-bottom:2px;}

.section-label{font-size:0.75rem;font-weight:700;color:var(--dim);margin:14px 0 6px;padding-left:8px;border-left:3px solid var(--gold);}

.word-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.word-chip{padding:6px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);font-family:inherit;font-size:0.72rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--text);}
.word-chip:hover{transform:scale(1.04);border-color:var(--muted);}
.word-chip.active{border-color:var(--gold);background:rgba(245,200,66,0.08);box-shadow:0 0 10px rgba(245,200,66,0.15);}
.chip-cn{font-size:0.58rem;color:var(--dim);margin-left:4px;}

.detail-card{background:rgba(245,200,66,0.04);border:1px solid rgba(245,200,66,0.12);border-radius:14px;padding:14px;margin-top:10px;animation:slideUp 0.25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.speak-btn{background:none;border:1px solid var(--gold);border-radius:50%;width:30px;height:30px;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.speak-btn:active{transform:scale(0.88);}

.block-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap;}
.blk{padding:8px 14px;border-radius:10px;font-size:0.9rem;font-weight:700;color:white;}
.blk-base{background:var(--blue);}
.blk-op{font-size:1.1rem;color:var(--gold);background:none;padding:0;}
.blk-particle{background:var(--purple);}
.blk-verb{background:var(--accent);}
.blk-result{background:var(--green);}

.quiz-row{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.quiz-opt{padding:8px 18px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.15s;}
.quiz-opt:hover{border-color:var(--muted);}
.quiz-opt.correct{border-color:var(--green);background:rgba(76,175,80,0.15);color:var(--green);}
.quiz-opt.wrong{border-color:var(--red);background:rgba(239,83,80,0.1);color:var(--red);}

.direction-viz{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0;font-size:1rem;font-weight:700;}
.dir-person{padding:8px 14px;border-radius:10px;font-size:0.8rem;font-weight:700;}
.dir-from{background:rgba(92,160,232,0.15);color:var(--blue);}
.dir-to{background:rgba(224,80,112,0.15);color:var(--accent);}
.dir-arrow{font-size:1.4rem;color:var(--gold);}

.progress-row{display:flex;align-items:center;gap:4px;padding:6px 12px;flex-wrap:wrap;}
.pill{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:transparent;font-size:0.55rem;font-weight:700;color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
.pill.done{border-color:var(--green);color:var(--green);background:rgba(76,175,80,0.1);}
.pill.current{border-color:var(--gold);color:var(--gold);}
.progress-label{margin-left:auto;font-size:0.65rem;color:var(--dim);}
</style>
</head>
<body>

<div class="top-bar">
  <button class="user-btn active" id="btn-iggy" onclick="switchUser('iggy')">🦊 Iggy</button>
  <button class="user-btn" id="btn-yoyo" onclick="switchUser('yoyo')">🐸 Yoyo</button>
  <div class="score-badge" id="score-badge">0 分</div>
</div>

<div class="rule-tabs" id="rule-tabs"></div>
<div class="content" id="content"></div>
<div class="progress-row" id="progress-row"></div>

<script>
// ═══════════════════════════════════════
// DATA: 6 Rules (Rule 2 fully implemented, others placeholder)
// ═══════════════════════════════════════
const RULES = [
  {
    id:'r_particle', emoji:'🏷️', name:'助詞導航 は/が/を/に',
    suffixDisplay:'🏷️ 助詞', coming:true, formula:'[名詞+助詞] + [動詞]',
    words:[]
  },
  {
    id:'r_giving', emoji:'🎁', name:'禮物流向 あげる/くれる',
    suffixDisplay:'🎁 授受', coming:false,
    formula:'[人+に] + [物+を] + あげる/くれる',
    comic:{
      title:'🎁 禮物流向',
      panels:[
        {emoji:'🎁',text:'我要送書給朋友',color:'#d4c8e8',border:'#a088c8'},
        {emoji:'➡️',text:'東西往外流 = あげる',color:'#c8d4e8',border:'#88a0c8'},
        {emoji:'⬅️',text:'東西流進來 = くれる',color:'#e8c8d4',border:'#c888a0'},
        {emoji:'✅',text:'方向決定動詞！',color:'#c8e8d4',border:'#88c8a0'}
      ],
      formula:'➡️ 送出去 = あげる ｜ ⬅️ 收進來 = くれる'
    },
    blindspot:{
      cn:'中文：「給」一個字通吃，不分方向',
      jp:'日文：送出去 = あげる，收進來 = くれる'
    },
    words:[
      {
        id:'jp_give_01',
        sentence:'私は友達に本をあげました。',
        chinese:'我送書給朋友。',
        base:'あげる',baseCn:'送出去',
        formula:'[私は] + [友達に] + [本を] + あげました',
        blocks:['私は','友達に','本を','あげました'],
        answer:['私は','友達に','本を','あげました'],
        quizType:'direction',
        direction:'outward',
        dirFrom:'私(我)',dirTo:'友達(朋友)',
        dirAnswer:'あげる',
        distractors:['くれる','もらう']
      },
      {
        id:'jp_give_02',
        sentence:'友達が私にプレゼントをくれました。',
        chinese:'朋友送我禮物。',
        base:'くれる',baseCn:'給我（流進來）',
        formula:'[友達が] + [私に] + [プレゼントを] + くれました',
        blocks:['友達が','私に','プレゼントを','くれました'],
        answer:['友達が','私に','プレゼントを','くれました'],
        quizType:'direction',
        direction:'inward',
        dirFrom:'友達(朋友)',dirTo:'私(我)',
        dirAnswer:'くれる',
        distractors:['あげる','もらう']
      },
      {
        id:'jp_give_03',
        sentence:'先生が妹にお菓子をくれました。',
        chinese:'老師給妹妹糖果。',
        base:'くれる',baseCn:'給我方（流進來）',
        formula:'[先生が] + [妹に] + [お菓子を] + くれました',
        blocks:['先生が','妹に','お菓子を','くれました'],
        answer:['先生が','妹に','お菓子を','くれました'],
        quizType:'direction',
        direction:'inward',
        dirFrom:'先生(老師)',dirTo:'妹(妹妹=我方)',
        dirAnswer:'くれる',
        distractors:['あげる','もらう']
      },
      {
        id:'jp_give_04',
        sentence:'私は母に花をあげました。',
        chinese:'我送花給媽媽。',
        base:'あげる',baseCn:'送出去',
        formula:'[私は] + [母に] + [花を] + あげました',
        blocks:['私は','母に','花を','あげました'],
        answer:['私は','母に','花を','あげました'],
        quizType:'direction',
        direction:'outward',
        dirFrom:'私(我)',dirTo:'母(媽媽)',
        dirAnswer:'あげる',
        distractors:['くれる','もらう']
      },
      {
        id:'jp_give_05',
        sentence:'友達が弟に本をくれました。',
        chinese:'朋友送書給弟弟。',
        base:'くれる',baseCn:'給我方（流進來）',
        formula:'[友達が] + [弟に] + [本を] + くれました',
        blocks:['友達が','弟に','本を','くれました'],
        answer:['友達が','弟に','本を','くれました'],
        quizType:'direction',
        direction:'inward',
        dirFrom:'友達(朋友)',dirTo:'弟(弟弟=我方)',
        dirAnswer:'くれる',
        distractors:['あげる','もらう']
      }
    ]
  },
  {id:'r_jita', emoji:'🎬', name:'自他動詞 開く/開ける', suffixDisplay:'🎬 自他', coming:true, formula:'自動詞(狀態) vs 他動詞(人為)', words:[]},
  {id:'r_exist', emoji:'📍', name:'存在句 あります/います', suffixDisplay:'📍 存在', coming:true, formula:'[場所に] + [物/生物が] + ある/いる', words:[]},
  {id:'r_teiru', emoji:'📸', name:'持續態 ～ている', suffixDisplay:'📸 持續', coming:true, formula:'[動詞て形] + いる', words:[]},
  {id:'r_kanji', emoji:'⚠️', name:'漢字陷阱 勉強≠勉強', suffixDisplay:'⚠️ 漢字', coming:true, formula:'同漢字 ≠ 同意思', words:[]}
];

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let currentUser = 'iggy';
let currentRuleIdx = 1; // Start at 授受動詞 (the pilot)
let selectedWordIdx = -1;
let totalScore = 0;
let progress = {};
let quizAnswered = {};

// ═══════════════════════════════════════
// USER DATA
// ═══════════════════════════════════════
function loadUserData() {
  currentUser = localStorage.getItem('jl-user') || 'iggy';
  totalScore = parseInt(localStorage.getItem('jl-'+currentUser+'-score') || '0');
  progress = JSON.parse(localStorage.getItem('jl-'+currentUser+'-progress') || '{}');
  quizAnswered = JSON.parse(localStorage.getItem('jl-'+currentUser+'-quiz') || '{}');
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+currentUser)?.classList.add('active');
  updateScore();
}
function saveUserData() {
  localStorage.setItem('jl-user', currentUser);
  localStorage.setItem('jl-'+currentUser+'-score', totalScore);
  localStorage.setItem('jl-'+currentUser+'-progress', JSON.stringify(progress));
  localStorage.setItem('jl-'+currentUser+'-quiz', JSON.stringify(quizAnswered));
}
function switchUser(uid) {
  currentUser = uid;
  localStorage.setItem('jl-user', uid);
  loadUserData();
  selectedWordIdx = -1;
  render();
}
function updateScore() {
  document.getElementById('score-badge').textContent = totalScore + ' 分';
}

// ═══════════════════════════════════════
// SPEAK
// ═══════════════════════════════════════
function speak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'ja-JP';
  u.rate = 0.75;
  speechSynthesis.speak(u);
}

// ═══════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════
function handleQuiz(wordKey, chosen, correct) {
  if (quizAnswered[wordKey]) return;
  quizAnswered[wordKey] = chosen;
  if (chosen === correct) {
    totalScore += 10;
    progress[wordKey] = 'correct';
  } else {
    progress[wordKey] = 'wrong';
  }
  saveUserData();
  updateScore();
  renderContent();
  renderProgress();
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render() { renderTabs(); renderContent(); renderProgress(); }

function renderTabs() {
  document.getElementById('rule-tabs').innerHTML = RULES.map((r, i) =>
    `<button class="rule-tab${i===currentRuleIdx?' active':''}${r.coming?' coming':''}" 
      onclick="${r.coming?'':'currentRuleIdx='+i+';selectedWordIdx=-1;render();'}">${r.suffixDisplay}${r.coming?' (soon)':''}</button>`
  ).join('');
}

function renderContent() {
  const r = RULES[currentRuleIdx];
  if (!r || r.coming || !r.words.length) {
    document.getElementById('content').innerHTML = `
      <div class="rule-card" style="text-align:center;padding:40px;">
        <div style="font-size:2rem;margin-bottom:10px;">${r?.emoji||'🚧'}</div>
        <div style="font-size:0.85rem;font-weight:700;">${r?.name||'Coming soon'}</div>
        <div style="font-size:0.7rem;color:var(--dim);margin-top:6px;">此規則即將加入，請先練習「🎁 授受動詞」</div>
      </div>`;
    return;
  }

  const c = r.comic;
  let h = `
  <div class="rule-card">
    <div class="rule-header">
      <span class="rule-emoji">${r.emoji}</span>
      <div>
        <div class="rule-name">${r.name} <button class="speak-btn" onclick="event.stopPropagation();speak('あげる')" style="width:24px;height:24px;font-size:0.8rem;vertical-align:middle;" title="唸 あげる">🔊</button> <button class="speak-btn" onclick="event.stopPropagation();speak('くれる')" style="width:24px;height:24px;font-size:0.8rem;vertical-align:middle;" title="唸 くれる">🔊</button></div>
        <span class="rule-formula-tag">${r.formula}</span>
      </div>
    </div>
    <div class="comic-grid">${c.panels.map((p,i)=>`
      <div class="comic-panel" style="background:${p.color};border:1px solid ${p.border}">
        <div class="panel-num">${i+1}</div>
        <div class="panel-emoji">${p.emoji}</div>
        <div class="panel-text">${p.text}</div>
      </div>`).join('')}
    </div>
    <div class="comic-formula-text">${c.formula} <button class="speak-btn" onclick="speak('あげる')" style="width:22px;height:22px;font-size:0.75rem;vertical-align:middle;" title="あげる">🔊</button> <button class="speak-btn" onclick="speak('くれる')" style="width:22px;height:22px;font-size:0.75rem;vertical-align:middle;" title="くれる">🔊</button></div>
    <div class="blindspot-box">
      <div class="bs-label">💡 中日文思維差異</div>
      <div class="bs-grid">
        <div class="bs-cn"><b>🇹🇼 中文</b>${r.blindspot.cn}</div>
        <div class="bs-jp"><b>🇯🇵 日文</b>${r.blindspot.jp}</div>
      </div>
    </div>
  </div>

  <div class="section-label">📚 練習句型（${r.words.length} 句）— 點擊挑戰</div>
  <div class="word-grid">${r.words.map((w,i)=>{
    const isActive = i === selectedWordIdx;
    const isDone = progress[w.id] === 'correct';
    return `<button class="word-chip${isActive?' active':''}" onclick="selectedWordIdx=${i};renderContent();renderProgress();" style="${isDone?'border-color:var(--green);':''}">
      <span>${isDone?'✅ ':''}${w.chinese}</span>
    </button>`;
  }).join('')}</div>`;

  if (selectedWordIdx >= 0) {
    const w = r.words[selectedWordIdx];
    const answered = quizAnswered[w.id];

    // Direction quiz for 授受動詞
    h += `
    <div class="detail-card">
      <div class="direction-viz">
        <span class="dir-person dir-from">${w.dirFrom} <span onclick="speak('${w.dirFrom.split('(')[0]}')" style="cursor:pointer;font-size:0.7rem;" title="唸">🔊</span></span>
        <span class="dir-arrow">${w.direction==='outward'?'➡️':'⬅️'}</span>
        <span class="dir-person dir-to">${w.dirTo} <span onclick="speak('${w.dirTo.split('(')[0]}')" style="cursor:pointer;font-size:0.7rem;" title="唸">🔊</span></span>
      </div>
      <div style="text-align:center;font-size:0.8rem;margin:6px 0;">
        <span style="color:var(--dim);">${w.chinese}</span>
      </div>
      <div style="text-align:center;font-size:0.72rem;color:var(--gold);margin:8px 0;">
        🧪 東西從 ${w.dirFrom.split('(')[0]} 流向 ${w.dirTo.split('(')[0]}，要用哪個動詞？
      </div>
      <div class="quiz-row">${[w.dirAnswer, ...w.distractors].sort(()=>Math.random()-0.5).map(o => {
        let cls = 'quiz-opt';
        if (answered) {
          if (o === w.dirAnswer) cls += ' correct';
          else if (o === answered && o !== w.dirAnswer) cls += ' wrong';
        }
        return `<button class="${cls}" onclick="handleQuiz('${w.id}','${o}','${w.dirAnswer}')"${answered?' disabled':''}>${o} <span onclick="event.stopPropagation();speak('${o}')" style="cursor:pointer;font-size:0.7rem;" title="唸 ${o}">🔊</span></button>`;
      }).join('')}</div>`;

    if (answered) {
      const isC = answered === w.dirAnswer;
      h += `
      <div style="text-align:center;margin-top:10px;font-size:0.75rem;color:${isC?'var(--green)':'var(--red)'};">
        ${isC?'✅ 正確！':'❌ 正確答案：'+w.dirAnswer}
      </div>
      <div style="text-align:center;margin:8px 0;font-size:0.68rem;color:var(--dim);">
        ${w.direction==='outward'?'➡️ 送出去（離開我方）= あげる':'⬅️ 流進來（進入我方）= くれる'}
      </div>
      <div style="text-align:center;margin:6px 0;">
        <span style="font-size:1rem;font-weight:700;">${w.sentence}</span>
        <button class="speak-btn" onclick="speak('${w.sentence}')" title="唸出完整句子" style="margin-left:6px;vertical-align:middle;">🔊</button>
      </div>
      <div class="block-row">
        ${w.blocks.map((b,i) => {
          let cls = 'blk ';
          if (b.includes('は') || b.includes('が')) cls += 'blk-base';
          else if (b.includes('に')) cls += 'blk-particle';
          else if (b.includes('を')) cls += 'blk-particle';
          else cls += 'blk-verb';
          return `<span class="${cls}">${b}</span>`;
        }).join('<span class="blk blk-op">+</span>')}
      </div>
      <div style="text-align:center;font-size:0.65rem;color:var(--dim);">${w.formula}</div>`;
    }
    h += `</div>`;
  }

  document.getElementById('content').innerHTML = h;
}

function renderProgress() {
  const r = RULES[currentRuleIdx];
  if (!r || !r.words.length) { document.getElementById('progress-row').innerHTML = ''; return; }
  const doneCount = r.words.filter(w => progress[w.id] === 'correct').length;
  document.getElementById('progress-row').innerHTML = r.words.map((w,i) => {
    const done = progress[w.id] === 'correct';
    const cur = i === selectedWordIdx;
    return `<button class="pill${done?' done':''}${cur?' current':''}" onclick="selectedWordIdx=${i};renderContent();renderProgress();">${i+1}</button>`;
  }).join('') + `<span class="progress-label">${doneCount}/${r.words.length}</span>`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
loadUserData();
render();
</script>
